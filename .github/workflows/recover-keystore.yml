name: Recover Keystore
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and bundle signing info
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          printf '%s' "$CI_KEYSTORE_B64" | base64 -d > ci.keystore
          ls -la ci.keystore
          sha256sum ci.keystore
          file ci.keystore || true
          printf 'alias=%s\npassword=%s\n' "$KEYSTORE_ALIAS" "$KEYSTORE_PASSWORD" > keystore_info.txt
      - name: Upload recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: keystore-recovery
          path: |
            ci.keystore
            keystore_info.txt
          if-no-files-found: error
          retention-days: 1
