name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/*'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_KEYSTORE_B64 }}
        run: |
          echo "$CI_KEYSTORE_B64" | base64 -d > ci.keystore
          ls -la ci.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          chmod +x gradlew
          # 把 CI 构建序号注入版本号：3.0.5(60)
          # run_number 由 GitHub 自动递增，天然满足 versionCode 单调递增要求
          echo "CI build number: ${{ github.run_number }}"
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PciBuildNumber=${{ github.run_number }}

      - name: Show APK version
        run: |
          ls -la app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" 2>/dev/null | head -2 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsCodeX-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
