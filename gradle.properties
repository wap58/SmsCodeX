# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2600m -XX:MaxMetaspaceSize=768m --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
# ButterKnife 注解处理器在 JDK17 需要 add-exports
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
android.enableResourceOptimizations=false
# 签名：默认取仓库根目录 ci.keystore（不入库，构建环境自行提供）
# 可用属性覆盖：tianma.keystore.path / tianma.signature.path
